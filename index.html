<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Web Game Demo</title>
  <!-- Nhúng thư viện Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Click thật nhanh! Điểm: <span id="score">0</span></h1>
  <button onclick="increaseScore()">Bấm để tăng điểm</button>
  <button onclick="saveScore()">Lưu lên Bảng Xếp Hạng</button>

  <h3>Top Điểm Cao:</h3>
  <ul id="leaderboard"></ul>

  <script>
    // 1. Khởi tạo kết nối Supabase
    const SUPABASE_URL = 'https://jxhgpnjmfijtkrzptavk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__sZw0JPlWKwYVK4FEa2h1Q_pRT2m2VE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentScore = 0;

    function increaseScore() {
      currentScore++;
      document.getElementById('score').innerText = currentScore;
    }

    // 2. Hàm ghi điểm vào Database
    async function saveScore() {
      const name = prompt("Nhập tên của bạn:") || "Ẩn danh";
      const { error } = await supabaseClient
        .from('leaderboard')
        .insert([{ player_name: name, score: currentScore }]);

      if (error) {
        alert("Lỗi lưu điểm: " + error.message);
      } else {
        alert("Đã lưu điểm!");
        loadLeaderboard(); // Tải lại BXH
      }
    }

    // 3. Hàm đọc dữ liệu từ Database
    async function loadLeaderboard() {
      const { data, error } = await supabaseClient
        .from('leaderboard')
        .select('player_name, score')
        .order('score', { ascending: false })
        .limit(5);

      if (data) {
        const list = document.getElementById('leaderboard');
        list.innerHTML = data
          .map(item => `<li><b>${item.player_name}</b>: ${item.score} điểm</li>`)
          .join('');
      }
    }

    // Tự động tải BXH khi mở trang
    loadLeaderboard();
  </script>
</body>
</html>
